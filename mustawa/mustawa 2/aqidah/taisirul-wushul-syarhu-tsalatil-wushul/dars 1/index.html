<!doctype html>
<html lang="ar" dir="rtl">

<title>الدرس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f7f7f7; --surface: #ffffff; --fg: #1f2421; --muted: #6f7772; --line: #e4e7e5;
  --green: #1b6a2a; --green-soft: #e3efe5; --on-green: #ffffff; --btn: #2f8a3a;
  --font: "Tajawal", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1b1f1c; --fg: #eef2ee; --muted: #9aa39d; --line: #2b312d;
    --green: #6fc27d; --green-soft: #223a27; --on-green: #0f1a11; --btn: #4fa85c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1b1f1c; --fg: #eef2ee; --muted: #9aa39d; --line: #2b312d;
  --green: #6fc27d; --green-soft: #223a27; --on-green: #0f1a11; --btn: #4fa85c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
[hidden] { display: none !important; }
button { font-family: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Top bar */
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px;
  background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,.08);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.ib { all: unset; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; transition: transform .15s ease, background-color .2s ease; }
.ib:hover { background: var(--green-soft); }
.ib:active { transform: scale(.9); }
.ib:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.ib svg { width: 26px; height: 26px; }
.ib.tr { color: var(--green); }
.ib.tr svg { transition: transform .35s ease; }
.ib.tr:active svg { transform: rotate(-12deg) scale(1.1); }
[dir="ltr"] .ib.back svg { transform: scaleX(-1); }
.titles { flex: 1; min-width: 0; padding-inline: 6px; }
.titles h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.titles p { margin: 2px 0 0; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; padding: 8px 14px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-weight: 500; font-size: 14px; }

/* Type tabs */
.types { display: flex; gap: 12px; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
.type {
  all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-height: 52px; padding-inline: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 26px; background: var(--bg); color: var(--muted);
  font-family: var(--font); font-size: 17px; font-weight: 500;
  transition: transform .15s ease, background-color .22s ease, color .22s ease, border-color .22s ease;
}
.type svg { width: 22px; height: 22px; }
.type:active { transform: scale(.94); }
.type:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.type[aria-selected="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); animation: selpop .3s cubic-bezier(.3,1.5,.5,1); }
@keyframes selpop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: none; } }

/* Panels */
main { flex: 1; }
.panel { animation: pagein .28s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #1c211e; display: grid; place-items: center; color: #fff; }
.video .play { width: 72px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.video .play svg { width: 28px; height: 28px; fill: #fff; stroke: none; }
.empty { margin: 0; padding: 48px 24px; text-align: center; color: var(--muted); font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty svg { width: 44px; height: 44px; opacity: .55; }
.video-cap { margin: 0; padding: 12px 16px; text-align: center; color: var(--muted); font-size: 14px; }

.video { background: #000 center / cover no-repeat; overflow: hidden; }
.vplay { all: unset; cursor: pointer; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.22); transition: background-color .2s ease; }
.vplay:hover { background: rgba(0,0,0,.1); }
.vplay:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }
.vplay .play { background: #f03; width: 74px; height: 52px; transition: transform .15s ease; }
.vplay:active .play { transform: scale(.92); }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.abox { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111; }
.abox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* Bottom bar */
.foot {
  position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px));
}
.nav { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; padding-inline: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-family: var(--font); font-size: 16px; font-weight: 500; border-radius: 12px; transition: transform .15s ease, opacity .2s ease; }
.nav svg { width: 22px; height: 22px; }
.nav:active { transform: scale(.94); }
.nav:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.nav[disabled] { opacity: .38; cursor: default; pointer-events: none; }
.nav.prev svg { transform: none; }
[dir="ltr"] .nav svg { transform: scaleX(-1); }
.finish {
  all: unset; box-sizing: border-box; cursor: pointer; min-height: 48px; padding-inline: 22px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--btn); color: #fff; font-family: var(--font); font-weight: 700; font-size: 17px;
  transition: transform .15s ease, background-color .22s ease, color .22s ease;
}
.finish svg { width: 24px; height: 24px; }
.finish:active { transform: scale(.95); }
.finish:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.finish.done { background: var(--green-soft); color: var(--green); }

/* Language popover */
.overlay { position: fixed; inset: 0; z-index: 70; background: transparent; }
.sheet {
  position: fixed; z-index: 71; top: calc(env(safe-area-inset-top, 0px) + 58px);
  inset-inline-start: max(12px, env(safe-area-inset-left, 0px));
  width: min(210px, calc(100% - 32px)); max-height: min(246px, calc(100% - 140px));
  padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.14); overflow: hidden; display: flex; flex-direction: column; animation: pop .16s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay:not(.open), .sheet:not(.open) { display: none !important; }
.langs { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.lang { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 44px; padding-inline: 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; font-family: var(--font); color: var(--fg); font-size: 15px; transition: transform .15s ease, background-color .2s ease; }
.lang:hover, .lang[aria-checked="true"] { background: var(--green-soft); }
.lang:active { transform: scale(.97); }
.lang:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
.lang .native { flex: 1; min-width: 0; }
.lang[aria-checked="true"] .native { color: var(--green); font-weight: 500; }
.lang .tick { width: 18px; height: 18px; stroke: var(--green); visibility: hidden; }
.lang[aria-checked="true"] .tick { visibility: visible; animation: tickin .3s cubic-bezier(.3,1.5,.5,1); }
@keyframes tickin { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }

/* Language-robust layout */
html[lang="zh"], html[lang="ja"] { --font: "Tajawal", system-ui, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Microsoft YaHei", "Yu Gothic", sans-serif; }
html[lang="zh"] body, html[lang="ja"] body { line-height: 1.6; }
body { overflow-wrap: break-word; }
.titles h1, .titles p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type { min-width: 0; padding-inline: 8px; gap: 8px; font-size: 16px; }
.type span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot { gap: 6px; }
.nav { flex: 0 1 auto; min-width: 0; max-width: 28%; padding-inline: 6px; font-size: 15px; }
.nav span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav svg { flex: none; }
.finish { flex: 1 1 auto; min-width: 0; padding: 6px 12px; font-size: 16px; line-height: 1.25; text-align: center; }
.finish svg { flex: none; }
.empty, .video-cap { overflow-wrap: break-word; }
@media (prefers-reduced-motion: reduce) {
  .panel, .type, .sheet, .lang .tick { animation: none !important; }
  .ib, .ib svg, .type, .nav, .finish, .lang { transition: none; }
}
</style>
</head>
<body>

<main>

</footer>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog"><div class="langs" id="langs" role="radiogroup"></div></section>

  function u(k) { return UI[lang][k]; }

  /* Complete lesson */
  $("finish").addEventListener("click", function () {
    isDone = !isDone;
    var i = done.indexOf(doneKey);
    if (isDone && i < 0) done.push(doneKey);
    if (!isDone && i > -1) done.splice(i, 1);
    try { localStorage.setItem("done", JSON.stringify(done)); } catch (e) {}
    paintFinish();
  });

  $("back").addEventListener("click", function () {
    if (history.length > 1) history.back(); else location.href = "../";
  });

  /* Language panel */
  var languages = [["ar","العربية"],["id","Bahasa Indonesia"],["en","English"],["tr","Türkçe"],["ur","اردو"],["fr","Français"],["es","Español"],["zh","中文"],["ja","日本語"]];
  var trBtn = $("translate"), overlay = $("overlay"), sheet = $("sheet"), langsBox = $("langs");
  var tick = '<svg class="tick" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>';
  function langName(l) {
    var name = l[1];
    try { var nm = new Intl.DisplayNames([lang], { type: "language" }).of(l[0]); if (nm) name = nm; } catch (e) {}
    if (["ar", "ur", "zh"].indexOf(lang) < 0) name = name.charAt(0).toLocaleUpperCase(lang) + name.slice(1);
    return name;
  }
  function renderLangs() {
    langsBox.innerHTML = languages.map(function (l) {
      return '<button type="button" class="lang" role="radio" data-code="' + l[0] + '" aria-checked="' + (l[0] === lang) + '"><span class="native">' + langName(l) + '</span>' + tick + '</button>';
    }).join("");
  }
  function openSheet() { renderLangs(); overlay.classList.add("open"); sheet.classList.add("open"); var c = langsBox.querySelector('[aria-checked="true"]'); if (c) c.focus(); }
  function closeSheet() { overlay.classList.remove("open"); sheet.classList.remove("open"); trBtn.focus(); }
  trBtn.addEventListener("click", openSheet);
  overlay.addEventListener("click", closeSheet);
  langsBox.addEventListener("click", function (e) {
    var b = e.target.closest(".lang"); if (!b) return;
    lang = b.dataset.code;
    try { localStorage.setItem("lang", lang); } catch (e2) {}
    closeSheet(); render();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });

  render();
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    try { var l = localStorage.getItem("lang"); if (l && UI[l] && l !== lang) { lang = l; render(); } } catch (e2) {}
  });
})();
</script>
</body>
</html>
