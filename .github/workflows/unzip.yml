name: Ekstrak ZIP otomatis

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak semua zip
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read f; do
            unzip -o "$f" -d "$(dirname "$f")"
            rm "$f"
          done

      - name: Commit hasil
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Ekstrak zip otomatis"
          git push
