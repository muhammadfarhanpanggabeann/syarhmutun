<head>

<style>
/* Layout: one-screen phone app, RTL, empty page area above a 4-tab bottom bar with a green pill on the active tab */
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --fg: #1f2421;
  --muted: #6f7772;
  --line: #e4e7e5;
  --green: #1b6a2a;
  --green-soft: #e3efe5; --on-green: #ffffff;
  --font: "Tajawal", "Noto Sans Arabic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1b1f1c; --fg: #eef2ee; --muted: #9aa39d;
    --line: #2b312d; --green: #6fc27d; --green-soft: #223a27; --on-green: #0f1a11;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1b1f1c; --fg: #eef2ee; --muted: #9aa39d;
  --line: #2b312d; --green: #6fc27d; --green-soft: #223a27; --on-green: #0f1a11;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 16px;
  display: flex; flex-direction: column;
  padding-block: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.top {
  display: flex; justify-content: flex-end; padding-block: 8px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top button {
  all: unset; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px;
  display: grid; place-items: center; border-radius: 50%; color: var(--green);
}
.top button:hover { background: var(--green-soft); }
.top button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.top svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
main { flex: 1; min-height: 0; overflow-y: auto; }
.page {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--muted);
}
.page h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--green); text-wrap: balance; }
.page p { margin: 0; font-size: 14px; }
nav {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav button {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: var(--font); font-size: 13px; color: var(--muted);
}
nav button .pill {
  width: 64px; height: 36px; border-radius: 18px;
  display: grid; place-items: center;
}
nav button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--green); }
nav button[aria-selected="true"] .pill { background: var(--green-soft); }
nav button[aria-selected="true"] svg { fill: currentColor; }
nav button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 12px; }

/* Search tab */
.search {
  display: flex; flex-direction: column; gap: 14px; padding-block: 4px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.searchbox {
  display: flex; align-items: center; gap: 10px; height: 54px; padding-inline: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  color: var(--muted); box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.searchbox:focus-within { border-color: var(--green); }
.searchbox svg, .tg svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.searchbox input { all: unset; flex: 1; min-width: 0; font: inherit; color: var(--fg); }
.searchbox input::placeholder { color: var(--muted); }
.toggles { display: flex; gap: 12px; flex-wrap: wrap; }
.tg {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding-inline: 20px;
  border-radius: 22px; border: 1px solid var(--line); background: var(--surface);
  color: var(--green); font-family: var(--font); font-weight: 500;
}
.tg[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.filters {
  display: flex; gap: 10px; overflow-x: auto; padding: 14px; scrollbar-width: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  all: unset; box-sizing: border-box; cursor: pointer; flex: none;
  height: 40px; padding-inline: 22px; display: inline-flex; align-items: center;
  border-radius: 20px; border: 1px solid var(--line); color: var(--fg); font-family: var(--font);
}
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sort { position: relative; display: flex; align-items: center; }
.sort select {
  appearance: none; -webkit-appearance: none; height: 44px; min-width: 160px;
  padding-inline-start: 16px; padding-inline-end: 36px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
  font-family: var(--font); font-size: 16px;
}
.sort svg { position: absolute; left: 12px; width: 18px; height: 18px; pointer-events: none; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.count {
  height: 36px; padding-inline: 16px; display: inline-flex; align-items: center;
  border-radius: 18px; background: var(--green-soft); color: var(--green); font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.list { display: flex; flex-direction: column; gap: 16px; }
.empty { margin: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }

/* Language panel */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  display: flex; flex-direction: column; max-height: 78%;
  background: var(--bg); border-radius: 24px 24px 0 0;
  padding-top: 8px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 -6px 24px rgba(0,0,0,.18);
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding-block: 6px 12px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--green); }
.sheet-head button {
  all: unset; box-sizing: border-box; cursor: pointer; width: 40px; height: 40px;
  display: grid; place-items: center; border-radius: 50%; color: var(--muted);
}
.sheet-head button:hover { background: var(--green-soft); }
.sheet-head button:focus-visible, .lang:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
.sheet-head svg, .lang svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.langs {
  overflow-y: auto; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
}
.lang {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding-inline: 18px;
  font-family: var(--font); color: var(--fg);
}
.lang + .lang { border-top: 1px solid var(--line); }
.lang .native { font-size: 17px; flex: 1; min-width: 0; }
.lang .latin { font-size: 13px; color: var(--muted); direction: ltr; }
.lang .tick { visibility: hidden; color: var(--green); }
.lang[aria-checked="true"] .native { color: var(--green); font-weight: 700; }
.lang[aria-checked="true"] .tick { visibility: visible; }

/* Language panel as a small popover under the translate icon */
.overlay { background: transparent; }
.sheet {
  top: calc(env(safe-area-inset-top, 0px) + 56px); bottom: auto; right: auto;
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(260px, calc(100% - 32px));
  max-height: min(420px, calc(100% - 140px));
  padding: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  overflow: hidden; transform-origin: top left; animation: pop .16s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.langs { margin: 0; border: 0; border-radius: 0; min-height: 0; background: transparent; }
.lang { min-height: 48px; padding-inline: 16px; }
.lang .native { font-size: 16px; }

/* Simpler, lighter language list */
.sheet { width: min(210px, calc(100% - 32px)); padding: 6px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.lang { min-height: 44px; padding-inline: 12px; border-radius: 10px; }
.lang + .lang { border-top: 0; }
.lang:hover { background: var(--green-soft); }
.lang .native { font-size: 15px; font-weight: 400; }
.lang[aria-checked="true"] { background: var(--green-soft); }
.lang[aria-checked="true"] .native { font-weight: 500; }
.lang .tick { width: 18px; height: 18px; }
.lang:focus-visible { outline-offset: -2px; }

/* Closed by default; does not depend on the hidden attribute */
.overlay:not(.open), .sheet:not(.open) { display: none !important; }

/* Direction-aware placement (works in both RTL and LTR) */
.sheet { left: auto; right: auto; inset-inline-end: max(16px, env(safe-area-inset-left, 0px)); transform-origin: top center; }
.sort svg { left: auto; inset-inline-end: 12px; }

/* Short language panel: about five rows visible, the rest scrolls */
.sheet { width: min(210px, calc(100% - 32px)); padding: 6px; border-radius: 14px; max-height: min(246px, calc(100% - 140px)); }
.langs { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.lang { min-height: 44px; padding-inline: 12px; border-radius: 10px; gap: 12px; }
.lang .native { font-size: 15px; }
.lang .tick { width: 18px; height: 18px; }

/* Course cards */
.card {
  display: flex; align-items: stretch; min-height: 94px; overflow: hidden;
  background: var(--surface); border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
}
.card .thumb { width: 94px; height: auto; flex: none; object-fit: cover; display: block; }
.card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 12px 14px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; text-wrap: balance; }
.card .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.card .rate { display: inline-flex; align-items: center; gap: 4px; }
.card .rate svg { width: 16px; height: 16px; fill: #f5a300; }
.card .rate b { color: var(--fg); font-weight: 500; font-size: 15px; }
.card .rate i { font-style: normal; }
.card .info { justify-content: center; }

/* Course detail panel */
.dpanel { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
.dpanel.open { display: flex; }
.dsheet { display: flex; flex-direction: column; width: 100%; max-width: 560px; height: 68%; background: var(--surface); border-radius: 24px 24px 0 0; overflow: hidden; box-shadow: 0 -6px 24px rgba(0,0,0,.2); animation: dup .22s ease-out; }
@keyframes dup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dsheet { animation: none; } }
.dbanner { position: relative; flex: none; height: 120px; background: var(--green-soft); }
.dbanner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dclose {
  all: unset; box-sizing: border-box; cursor: pointer; position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 12px); inset-inline-start: 12px;
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(0,0,0,.5); color: #fff;
}
.dclose:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.dclose svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.dbody {
  flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 12px;
}
.dbadge { display: inline-block; padding: 10px 22px; border-radius: 18px; background: var(--green-soft); color: var(--green); font-weight: 500; font-size: 15px; border: 1px solid var(--line); }
.dtitle { margin: 12px 0 14px; font-size: 20px; font-weight: 700; line-height: 1.5; text-wrap: balance; }
.dstats { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.dstat { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.dstat b { color: var(--fg); font-size: 20px; font-weight: 700; }
.dstat svg { width: 22px; height: 22px; fill: var(--muted); }
.dstat.rate svg { fill: #f5a300; }
.dstat.rate b { color: var(--green); }
.dh { margin: 22px 0 12px; font-size: 20px; font-weight: 700; }
.dbody p { margin: 0 0 14px; line-height: 1.9; font-size: 16px; color: var(--muted); }
.dpdf {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 52px; margin: 4px 0 16px; border-radius: 14px;
  background: #0f7a6d; color: #fff; font-family: var(--font); font-weight: 700; font-size: 17px;
}
.dpdf:focus-visible, .dgo:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.dfoot { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.dgo {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 54px; border-radius: 27px; background: var(--green); color: var(--on-green);
  font-family: var(--font); font-weight: 700; font-size: 17px;
}
/* Curved tab bar */
nav { margin: 0 12px 10px; border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.10); padding-block: 8px; overflow: hidden; }
nav button .pill { border-radius: 20px; }
/* Glass tab bar (floats over content so the blur shows) */
:root { --glass: rgba(255,255,255,.42); --glass-line: rgba(255,255,255,.65); --glass-shadow: rgba(20,40,25,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --glass: rgba(34,40,36,.42); --glass-line: rgba(255,255,255,.14); --glass-shadow: rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --glass: rgba(34,40,36,.42); --glass-line: rgba(255,255,255,.14); --glass-shadow: rgba(0,0,0,.45); }
main { padding-bottom: 104px; }
nav {
  position: fixed; z-index: 30; margin: 0;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-line); border-radius: 28px;
  box-shadow: 0 8px 28px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
}
nav button[aria-selected="true"] .pill { background: color-mix(in srgb, var(--green) 20%, transparent); }
/* Tab animations */
nav button .pill { transition: background-color .25s ease, transform .15s ease; }
nav button svg { transition: transform .2s ease; }
nav button:active .pill { transform: scale(.9); }
nav button[aria-selected="true"] .pill { animation: pillin .32s cubic-bezier(.3,1.4,.5,1); }
nav button[aria-selected="true"] svg { animation: iconpop .38s cubic-bezier(.3,1.5,.5,1); }
@keyframes pillin { from { transform: scaleX(.55); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes iconpop { 0% { transform: scale(.7) translateY(3px); } 60% { transform: scale(1.18) translateY(-2px); } 100% { transform: none; } }
.page, .search { animation: pagein .28s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  nav button .pill, nav button svg, .page, .search { animation: none !important; transition: none; }
}
/* Button animations */
.top button, .tg, .chip, .lang, .dclose, .dpdf, .dgo, .card { transition: transform .15s ease, background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease; }
.top button:active, .tg:active, .chip:active, .dclose:active { transform: scale(.92); }
.lang:active { transform: scale(.97); }
.dpdf:active, .dgo:active { transform: scale(.97); }
.card:active { transform: scale(.98); }
.tg[aria-pressed="true"], .chip[aria-pressed="true"] { animation: selpop .3s cubic-bezier(.3,1.5,.5,1); }
.lang[aria-checked="true"] .tick { animation: tickin .3s cubic-bezier(.3,1.5,.5,1); }
.top svg { transition: transform .35s ease; }
.top button:active svg { transform: rotate(-12deg) scale(1.1); }
.dsheet .dclose svg { transition: transform .25s ease; }
.dclose:active svg { transform: rotate(90deg); }
@keyframes selpop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: none; } }
@keyframes tickin { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
.card { animation: cardin .3s ease-out backwards; }
@keyframes cardin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .top button, .tg, .chip, .lang, .dclose, .dpdf, .dgo, .card, .top svg, .dclose svg { transition: none; }
  .tg, .chip, .lang .tick, .card { animation: none !important; }
}
/* Language-robust layout */
html[lang="zh"], html[lang="ja"] { --font: "Tajawal", system-ui, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Microsoft YaHei", "Yu Gothic", sans-serif; }
html[lang="zh"] body, html[lang="ja"] body { line-height: 1.6; }
body { overflow-wrap: break-word; }
nav button { min-width: 0; }
nav button > span:last-child { max-width: 100%; padding-inline: 2px; font-size: 12.5px; line-height: 1.25; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toggles { gap: 10px; }
.tg { flex: 1 1 auto; justify-content: center; white-space: nowrap; padding-inline: 16px; min-width: 0; }
.bar { flex-wrap: wrap; }
.sort { flex: 1 1 150px; min-width: 0; }
.sort select { width: 100%; min-width: 0; text-overflow: ellipsis; }
.count { white-space: nowrap; }
.card h3 { overflow-wrap: break-word; hyphens: auto; line-height: 1.5; }
.dstats { flex-wrap: wrap; gap: 10px 16px; }
.dstat { white-space: nowrap; }
.dbadge { max-width: 100%; }
.dtitle { font-size: clamp(18px, 5.2vw, 22px); overflow-wrap: break-word; hyphens: auto; }
.dpdf, .dgo { padding: 8px 16px; text-align: center; line-height: 1.3; }
html:not([lang="ar"]):not([lang="ur"]) .dbody p { line-height: 1.65; }
.top { position: relative; z-index: 60; }
.overlay { z-index: 70 !important; }
.sheet { z-index: 71 !important; }
.card h3[data-i] { cursor: pointer; }
.card h3[data-i]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
</style>

<header class="top">

    <svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
  </button>
</header>

<main id="view" role="tabpanel" aria-live="polite"></main>

  <button role="tab" id="tab-home" data-tab="home" aria-selected="true">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>

      b: ["🔹 三大原则及其证据讲解课程 - 远程", "📖 依据谢赫阿卜杜勒·穆哈辛·卡西姆博士的《便捷通达》", "🎙️ 附有本书音频录音", "📘 课程指定讲解：", "📊 附每日复习测验，自动批改。", "🌟 学员可获得：", "1- 三大原则的传承授权（伊扎扎）", "2- 优秀者结业证书", "3- 《便捷通达》授权"] },
    ja: { lessons: "レッスン", reviews: "件の評価", about: "コースについて", pdf: "解説ファイルをダウンロード (PDF)", follow: "コースを続ける", close: "閉じる",
      b: ["🔹 三つの基本原則とその証拠の解説コース - オンライン", "📖 シェイフ・アブドゥルムフスィン・アル＝カースィム博士の『タイスィール・アル・ウスール』に基づく", "🎙️ 書籍の音声録音付き", "📘 コース公式の解説：", "📊 復習に役立つ毎日の確認テスト付き（自動採点）。", "🌟 受講者が得られるもの：", "1- 三つの基本原則の伝承付き免許", "2- 優秀者への修了証", "3- タイスィール・アル・ウスールの免許"] }
  };
  function dt(k) { return (DT[currentLang] || DT.ar)[k]; }
  var dPanel = document.createElement("section");
  dPanel.className = "dpanel"; dPanel.setAttribute("role", "dialog"); dPanel.setAttribute("aria-modal", "true");
  document.body.appendChild(dPanel);
  var dLast = null, dIdx = -1;
  function openDetail(i) {
    var c = COURSES[i]; if (!c) return;
    dIdx = i;
    var b = dt("b");
    var ttl = (c.titles && c.titles[currentLang]) || c.title;
    dLast = document.activeElement;
    dPanel.setAttribute("aria-label", ttl);
    dPanel.innerHTML = '<div class="dsheet">' +
      '<div class="dbanner"><img src="' + c.img + '" alt="">' +
        '<button type="button" class="dclose" aria-label="' + dt("close") + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
      '<div class="dbody">' +
        '<span class="dbadge">' + t(c.level) + '</span>' +
        '<h2 class="dtitle" dir="auto">' + ttl + '</h2>' +
        '<div class="dstats">' +
          '<span class="dstat"><svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6z"/></svg><b>' + c.lessons + '</b> ' + dt("lessons") + '</span>' +
          '<span class="dstat"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500"/><circle cx="17" cy="9" r="2.500"/><path d="M2 20c0-3.500 3-6 7-6s7 2.500 7 6zM16 14c3 0 6 1.800 6 5h-4.500"/></svg><b>' + c.students + '</b> ' + t("students") + '</span>' +
          '<span class="dstat rate"><svg viewBox="0 0 24 24"><path d="m12 2 3 6.500 7 .8-5.200 4.800 1.400 7L12 17.500 5.800 21l1.400-7L2 9.300l7-.8z"/></svg><b>' + c.rating + '</b> (' + c.reviews + ' ' + dt("reviews") + ')</span>' +
        '</div>' +
        '<h3 class="dh">' + dt("about") + '</h3>' +
        '<p dir="auto">' + b[0] + '</p><p dir="auto">' + b[1] + '</p><p dir="auto">' + b[2] + '</p><p dir="auto">' + b[3] + '</p>' +
        '<button type="button" class="dpdf" id="dpdf">' + dt("pdf") + ' ⬇</button>' +
        '<p dir="auto">' + b[4] + '</p><p dir="auto">' + b[5] + '</p>' +
        '<p dir="auto">' + b[6] + '<br>' + b[7] + '<br>' + b[8] + '</p>' +
      '</div>' +
      '<div class="dfoot"><button type="button" class="dgo" id="dgo">' + dt("follow") + '</button></div></div>';
    dPanel.classList.add("open");
    dPanel.querySelector(".dbody").scrollTop = 0;
    dPanel.querySelector(".dclose").focus();
    dPanel.querySelector(".dclose").addEventListener("click", closeDetail);
    dPanel.querySelector("#dpdf").addEventListener("click", function () { if (c.pdf) window.open(c.pdf, "_blank"); });
    dPanel.querySelector("#dgo").addEventListener("click", function () {
      try { sessionStorage.setItem("course", JSON.stringify({ title: c.title, titles: c.titles, img: c.img, lessons: c.lessons })); } catch (e) {}
      location.href = "course.html";
    });
  }
  function closeDetail() {
    if (!dPanel.classList.contains("open")) return;
    dPanel.classList.remove("open");
    if (dLast && dLast.focus) { try { dLast.focus(); } catch (e) {} }
  }
  dPanel.addEventListener("click", function (e) { if (e.target === dPanel) closeDetail(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });

  var searchMode = "levels";
  var activeKey = "all";
  var FKEYS = { levels: ["all", "level1", "level2"], arts: ["all", "aqidah"] };
  var modeKeys = { levels: "all", arts: "all" };
  try {
    var sf = JSON.parse(localStorage.getItem("filter") || "null");
    if (sf) {
      if (sf.keys) { Object.keys(modeKeys).forEach(function (m) { if (FKEYS[m].indexOf(sf.keys[m]) > -1) modeKeys[m] = sf.keys[m]; }); }
      else if (FKEYS[sf.mode] && FKEYS[sf.mode].indexOf(sf.key) > -1) modeKeys[sf.mode] = sf.key;
      if (FKEYS[sf.mode]) searchMode = sf.mode;
      activeKey = modeKeys[searchMode];
    }
  } catch (e) {}
  function saveFilter() {
    modeKeys[searchMode] = activeKey;
    try { localStorage.setItem("filter", JSON.stringify({ mode: searchMode, keys: modeKeys })); } catch (e) {}
  }
  function filtered() {
    return COURSES.filter(function (c) {
      return (modeKeys.levels === "all" || c.level === modeKeys.levels) && (modeKeys.arts === "all" || c.art === modeKeys.arts);
    });
  }
  function countText(n) {
    var txt = t("count").replace("{n}", n);
    if (n === 1 && currentLang === "en") txt = txt.replace("courses", "course");
    if (n === 1 && currentLang === "es") txt = txt.replace("cursos", "curso");
    return txt;
  }
  function studentsText(n) {
    return RTL.indexOf(currentLang) > -1 ? t("students") + " " + n : n + " " + t("students");
  }
  function cardHTML(c) {
    return '<article class="card">' +
      '<img class="thumb" src="' + c.img + '" alt="">' +
      '<div class="info">' +
        '<h3 dir="auto" role="button" tabindex="0" data-i="' + COURSES.indexOf(c) + '">' + ((c.titles && c.titles[currentLang]) || c.title) + '</h3>' +
      '</div></article>';
  }
  function listHTML() {
    var items = filtered();
    return items.length ? items.map(cardHTML).join("") : '<p class="empty">' + t("none") + '</p>';
  }
  function renderList() {
    view.querySelector("#list").innerHTML = listHTML();
    view.querySelector("#count").textContent = countText(filtered().length);
  }
  function chipsHTML() {
    var keys = searchMode === "arts" ? ["all", "aqidah"] : ["all", "level1", "level2"];
    return keys.map(function (k) {
      return '<button class="chip" data-key="' + k + '" aria-pressed="' + (k === activeKey) + '">' + t(k) + '</button>';
    }).join("");
  }

  function searchPage() {
    return '<section class="search">' +
      '<label class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>' +
      '<input id="q" type="search" placeholder="' + t("ph") + '" autocomplete="off"></label>' +
      '<div class="toggles" role="group">' +
        '<button class="tg" data-k="levels" aria-pressed="' + (searchMode === "levels") + '"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.500 9 5 9-5" opacity=".0"/></svg>' + t("levels") + '</button>' +
        '<button class="tg" data-k="arts" aria-pressed="' + (searchMode === "arts") + '"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.500" height="7.500" rx="1.500"/><rect x="13.500" y="3" width="7.500" height="7.500" rx="1.500"/><rect x="3" y="13.500" width="7.500" height="7.500" rx="1.500"/><rect x="13.500" y="13.500" width="7.500" height="7.500" rx="1.500"/></svg>' + t("arts") + '</button>' +
      '</div>' +
      '<div class="filters" id="filters" role="group">' + chipsHTML() + '</div>' +
      '<div class="bar">' +
        '<div class="sort"><select id="sort" aria-label="' + t("sort") + '"><option>' + t("sort") + '</option></select><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>' +
        '<span class="count" id="count">' + countText(filtered().length) + '</span>' +
      '</div>' +
      '<div class="list" id="list">' + listHTML() + '</div>' +
    '</section>';
  }

  function bindSearch() {
    var lst = view.querySelector("#list");
    lst.addEventListener("click", function (e) { var h = e.target.closest("h3[data-i]"); if (h) openDetail(+h.dataset.i); });
    lst.addEventListener("keydown", function (e) {
      var h = e.target.closest("h3[data-i]");
      if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(+h.dataset.i); }
    });
    var box = view.querySelector("#filters");
    box.addEventListener("click", function (e) {
      var c = e.target.closest(".chip");
      if (!c) return;
      activeKey = c.dataset.key;
      saveFilter();
      Array.prototype.forEach.call(box.querySelectorAll(".chip"), function (o) { o.setAttribute("aria-pressed", o === c ? "true" : "false"); });
      renderList();
    });
    var tg = view.querySelectorAll(".tg");
    Array.prototype.forEach.call(tg, function (b) {
      b.addEventListener("click", function () {
        modeKeys[searchMode] = activeKey;
        searchMode = b.dataset.k;
        activeKey = modeKeys[searchMode];
        saveFilter();
        Array.prototype.forEach.call(tg, function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
        box.innerHTML = chipsHTML();
        box.scrollLeft = 0;
        renderList();
      });
    });
  }
  var tabs = Array.prototype.slice.call(document.querySelectorAll("nav [role=tab]"));

  function show(name) {
    if (!titles[name]) name = "home";
    tabs.forEach(function (t) {
      t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false");
    });
    closeDetail();
    view.setAttribute("aria-labelledby", "tab-" + name);
    view.innerHTML = name === "search" ? searchPage() : emptyPage(name);
    if (name === "search") bindSearch();
    currentTab = name;
    try { sessionStorage.setItem("tab", name); } catch (e) {}
  }

  tabs.forEach(function (t) {
    t.addEventListener("click", function () { show(t.dataset.tab); });
  });

  /* Language panel */
  var languages = [
    ["ar", "العربية"],
    ["id", "Bahasa Indonesia"],
    ["en", "English"],
    ["tr", "Türkçe"],
    ["ur", "اردو"],
    ["fr", "Français"],
    ["es", "Español"],
    ["zh", "中文"],
    ["ja", "日本語"]
  ];
  var trBtn = document.getElementById("translate");
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  var langsBox = document.getElementById("langs");
  var tick = '<svg class="tick" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>';

  function langName(l) {
    var name = l[1];
    try {
      var n = new Intl.DisplayNames([currentLang], { type: "language" }).of(l[0]);
      if (n) name = n;
    } catch (e) {}
    if (["ar", "ur", "zh"].indexOf(currentLang) < 0) name = name.charAt(0).toLocaleUpperCase(currentLang) + name.slice(1);
    return name;
  }

  function renderLangs() {
    langsBox.innerHTML = languages.map(function (l) {
      return '<button type="button" class="lang" role="radio" data-code="' + l[0] + '" aria-checked="' + (l[0] === currentLang) + '">' +
        '<span class="native">' + langName(l) + '</span>' + tick + '</button>';
    }).join("");
  }
  function openSheet() {
    renderLangs();
    overlay.classList.add("open"); sheet.classList.add("open");
    var cur = langsBox.querySelector('[aria-checked="true"]');
    if (cur) cur.focus();
  }
  function closeSheet() {
    overlay.classList.remove("open"); sheet.classList.remove("open");
    trBtn.focus();
  }
  trBtn.addEventListener("click", openSheet);
  overlay.addEventListener("click", closeSheet);
  langsBox.addEventListener("click", function (e) {
    var b = e.target.closest(".lang");
    if (!b) return;
    currentLang = b.dataset.code;
    try { localStorage.setItem("lang", currentLang); } catch (e) {}
    renderLangs();
    closeSheet();
    applyLang();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
  });

  function applyLang() {
    var de = document.documentElement;
    de.setAttribute("lang", currentLang);
    de.setAttribute("dir", RTL.indexOf(currentLang) > -1 ? "rtl" : "ltr");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    trBtn.setAttribute("aria-label", t("translate"));
    trBtn.setAttribute("title", t("translate"));
    sheet.setAttribute("aria-label", t("lang"));
    langsBox.setAttribute("aria-label", t("lang"));
    document.querySelector("nav").setAttribute("aria-label", t("nav"));
    var wasOpen = dPanel.classList.contains("open"), idx = dIdx;
    show(currentTab);
    if (wasOpen && currentTab === "search") openDetail(idx);
  }

  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    try { var l = localStorage.getItem("lang"); if (l && I18N[l] && l !== currentLang) { currentLang = l; applyLang(); } } catch (e2) {}
  });
  var start = "home";
  try { start = sessionStorage.getItem("tab") || "home"; } catch (e) {}
  currentTab = start;
  applyLang();
})();
</script>
</body>
</html>
